# 【週次レポートの自動生成】
# 毎週月曜の朝7時（日本時間）に、直近7日間のデータから日本語レポートを作って
# reports/ フォルダに保存します。
# ※ 日本時間 月曜 7:00 = UTC 日曜 22:00

name: 週次レポート生成

on:
  schedule:
    - cron: "0 22 * * 0"   # 毎週 日曜 UTC 22:00 = 日本時間 月曜 朝 7:00
  workflow_dispatch:        # 手動実行ボタン

permissions:
  contents: write

concurrency:
  group: threads-data
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要なライブラリをインストール
        run: pip install -r requirements.txt

      - name: レポートを生成
        run: python scripts/weekly_report.py

      - name: レポートをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ logs/
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "週次レポート: $(TZ=Asia/Tokyo date +%Y-%m-%d) 作成"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi
